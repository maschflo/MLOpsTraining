name: CI
on:
  push:
    branches:
      - master
  workflow_dispatch:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt --no-cache-dir
      - name: Run tests
        run: pytest tests/*
      - name: Build docker
        run: docker build -t ai4i-api:${{ github.sha }} .


